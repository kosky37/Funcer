name: Create Release

on:
  push:
    branches: ["main"]
    paths:
      - "Funcer/Funcer.csproj"

jobs:
  check-version-and-release:
    runs-on: ubuntu-latest
    # Only run if not from a tag (to avoid duplicate releases)
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: write  # Needed to create releases and push tags
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare versions
          token: ${{ secrets.GITHUB_TOKEN }}  # Use default token with proper permissions
      
      - name: Extract current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep -oP '<Version>\K[^<]+' Funcer/Funcer.csproj)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
      
      - name: Extract previous version
        id: previous_version
        run: |
          if git show HEAD~1:Funcer/Funcer.csproj > /dev/null 2>&1; then
            PREVIOUS_VERSION=$(git show HEAD~1:Funcer/Funcer.csproj | grep -oP '<Version>\K[^<]+' || echo "")
          else
            PREVIOUS_VERSION=""
          fi
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: ${PREVIOUS_VERSION:-'(not found)'}"
      
      - name: Check if version changed
        id: version_changed
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          PREVIOUS="${{ steps.previous_version.outputs.previous_version }}"
          
          if [ -z "$CURRENT" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Error: Could not extract current version"
            exit 1
          fi
          
          if [ -z "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "First version detected: $CURRENT (creating release)"
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS to $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version did not change ($CURRENT)"
          fi
      
      - name: Create and push tag
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          TAG_NAME="v${{ steps.current_version.outputs.version }}"
          # Check if tag already exists
          if git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists, skipping tag creation"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME"
          fi
      
      - name: Create Release
        if: steps.version_changed.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.current_version.outputs.version }}
          name: Release v${{ steps.current_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
